<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cortex RAG - Streamlined Consumer AI Chat</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gradient-to-br from-purple-50 via-fuchsia-50/40 to-indigo-50/50 text-purple-950 font-sans antialiased overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [provider, setProvider] = useState('openai');
      const [apiKey, setApiKey] = useState('');
      const [ollamaUrl, setOllamaUrl] = useState('http://localhost:11434');

      const [documents, setDocuments] = useState([
        { id: '1', name: 'sample_doc.pdf', pages: 3, size: '1.2 MB' },
        { id: '2', name: 'resume_ats_verified.pdf', pages: 1, size: '0.8 MB' }
      ]);

      const [query, setQuery] = useState('');
      const [messages, setMessages] = useState([
        {
          id: 'm1',
          role: 'assistant',
          content: 'Hello. I am Cortex, your document intelligence assistant. Upload your PDF files in the sidebar and ask any questions about their content.',
          citations: []
        }
      ]);
      const [isProcessing, setIsProcessing] = useState(false);

      const hasConversation = messages.length > 1;

      const handleRemoveDoc = (id) => {
        setDocuments((prev) => prev.filter((doc) => doc.id !== id));
      };

      const handleSendMessage = (e) => {
        e?.preventDefault();
        if (!query.trim()) return;

        const userMsg = { id: `u_${Date.now()}`, role: 'user', content: query };
        setMessages((prev) => [...prev, userMsg]);
        setQuery('');
        setIsProcessing(true);

        setTimeout(() => {
          const botMsg = {
            id: `b_${Date.now()}`,
            role: 'assistant',
            content: `Based on your documents, Retrieval-Augmented Generation (RAG) fuses dense vector embeddings with sparse keyword search to deliver precise context to LLMs like ${provider === 'openai' ? 'GPT-4o' : 'Llama3'}.`,
            citations: [
              { file_name: 'sample_doc.pdf', page_number: 1 },
              { file_name: 'sample_doc.pdf', page_number: 2 }
            ]
          };
          setMessages((prev) => [...prev, botMsg]);
          setIsProcessing(false);
        }, 1200);
      };

      return (
        <div className="flex h-screen w-full overflow-hidden">
          {/* STREAMLINED SIDEBAR */}
          <aside className="w-72 border-r border-purple-100/80 bg-white/70 backdrop-blur-xl flex flex-col justify-between p-4 shadow-xs z-20">
            <div className="space-y-6">
              <div className="flex items-center space-x-3 px-2 py-1">
                <div className="h-9 w-9 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white font-bold shadow-md shadow-purple-500/20">
                  ⚡
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-none text-purple-950">Cortex RAG</h1>
                  <span className="text-[11px] text-purple-600 font-medium">Document Assistant</span>
                </div>
              </div>

              {/* Minimalist Upload Zone */}
              <div className="space-y-2">
                <h3 className="text-xs font-bold text-purple-900 uppercase tracking-wider px-1">
                  Add Documents
                </h3>
                <div className="border-2 border-dashed border-purple-200/80 rounded-2xl p-4 text-center bg-purple-50/30 hover:bg-purple-50/70 transition-all cursor-pointer">
                  <p className="text-xs font-semibold text-purple-900">Upload PDF Files</p>
                  <p className="text-[10px] text-purple-500 mt-0.5">Drag and drop or click</p>
                </div>
              </div>

              {/* Indexed Files List */}
              <div className="space-y-2.5">
                <div className="flex items-center justify-between px-1">
                  <h3 className="text-xs font-bold text-purple-900 uppercase tracking-wider">
                    Indexed Files ({documents.length})
                  </h3>
                  <span className="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                </div>

                <div className="space-y-2 max-h-[340px] overflow-y-auto pr-1">
                  {documents.map((doc) => (
                    <div key={doc.id} className="flex items-center justify-between p-3 rounded-xl border border-purple-100 bg-white/90 shadow-2xs hover:border-purple-200">
                      <div className="truncate text-xs">
                        <p className="font-semibold text-purple-950 truncate">{doc.name}</p>
                        <p className="text-[10px] text-purple-500">{doc.pages} pages • {doc.size}</p>
                      </div>
                      <button onClick={() => handleRemoveDoc(doc.id)} className="text-purple-400 hover:text-rose-600 text-xs px-1">
                        ✕
                      </button>
                    </div>
                  ))}
                  {documents.length === 0 && (
                    <p className="text-xs text-purple-400 text-center py-4">No documents indexed yet.</p>
                  )}
                </div>
              </div>
            </div>

            {/* Sidebar Bottom: Gear Settings Button */}
            <div className="pt-3 border-t border-purple-100 flex items-center justify-between">
              <span className="text-xs font-semibold text-emerald-700">● Operational</span>
              <button
                onClick={() => setShowSettingsModal(true)}
                className="p-2 rounded-xl text-purple-600 hover:bg-purple-100/60 font-bold"
                title="Settings"
              >
                ⚙️
              </button>
            </div>
          </aside>

          {/* MAIN CHAT STAGE */}
          <main className="flex-1 flex flex-col relative overflow-hidden">
            {/* Top Bar */}
            <header className="h-16 border-b border-purple-100/80 bg-white/40 backdrop-blur-md px-8 flex items-center justify-between z-10">
              <span className="px-3 py-1 rounded-full bg-purple-100/80 text-purple-900 text-xs font-semibold border border-purple-200/50">
                Model: {provider === 'openai' ? 'GPT-4o' : 'Llama3'}
              </span>

              <div className="flex items-center space-x-3">
                <button
                  onClick={() => setShowSettingsModal(true)}
                  className="p-2 rounded-xl border border-purple-200/80 bg-white/80 text-purple-700 hover:bg-purple-50 text-xs font-semibold shadow-2xs"
                >
                  ⚙️ Settings
                </button>
                <button className="px-4 py-2 rounded-xl bg-purple-950 text-white text-xs font-semibold hover:bg-purple-900 shadow-md">
                  Deploy
                </button>
              </div>
            </header>

            {/* Chat Timeline */}
            <div className="flex-1 overflow-y-auto px-6 py-6 space-y-6 max-w-3xl mx-auto w-full flex flex-col justify-between">
              {/* Dynamic Hero */}
              <div className={`transition-all duration-500 text-center ${hasConversation ? 'py-2 scale-90 opacity-80' : 'py-10 scale-100 opacity-100'}`}>
                <div className="mx-auto mb-4 h-20 w-20 rounded-full bg-gradient-to-tr from-purple-400 to-indigo-600 shadow-xl shadow-purple-400/40 animate-pulse flex items-center justify-center">
                  <div className="h-16 w-16 rounded-full bg-white/20 backdrop-blur-xs border border-white/60"></div>
                </div>
                <h2 className="text-2xl font-bold text-purple-950">How can I assist you today?</h2>
                <p className="text-xs text-purple-600 mt-1 font-medium">Ask questions about your uploaded documents</p>
              </div>

              {/* Message Cards */}
              <div className="space-y-4 flex-1">
                {messages.map((msg) => (
                  <div key={msg.id} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-xl rounded-2xl p-5 shadow-xs border backdrop-blur-md ${msg.role === 'user' ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white border-purple-500/30' : 'bg-white/90 text-purple-950 border-purple-100'}`}>
                      <div className="text-sm leading-relaxed">{msg.content}</div>
                      {msg.citations && msg.citations.length > 0 && (
                        <div className="mt-4 pt-3 border-t border-purple-100 flex flex-wrap gap-2">
                          {msg.citations.map((cite, cIdx) => (
                            <span key={cIdx} className="px-2.5 py-1 rounded-xl bg-purple-100 border border-purple-200 text-[11px] font-semibold text-purple-800">
                              📄 {cite.file_name} | Page {cite.page_number}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ))}

                {isProcessing && (
                  <div className="flex justify-start">
                    <div className="rounded-2xl p-4 bg-white/90 border border-purple-100 text-purple-600 text-xs font-semibold animate-pulse">
                      Thinking & searching document context...
                    </div>
                  </div>
                )}
              </div>

              {/* FLOATING PROMPT BAR */}
              <form onSubmit={handleSendMessage} className="sticky bottom-4 mx-auto w-full max-w-2xl bg-white/90 backdrop-blur-xl border border-purple-200/80 rounded-full p-2 pl-4 shadow-xl flex items-center space-x-3">
                <button type="button" className="p-2 rounded-full text-purple-500 hover:bg-purple-100" title="Attach document">
                  📎
                </button>
                <input
                  type="text"
                  placeholder="Ask anything about your documents..."
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  className="flex-1 bg-transparent text-sm text-purple-950 placeholder-purple-400 focus:outline-none"
                />
                <button
                  type="submit"
                  disabled={!query.trim() || isProcessing}
                  className="p-2.5 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md hover:from-purple-700 disabled:opacity-40"
                >
                  ➔
                </button>
              </form>
            </div>
          </main>

          {/* SETTINGS MODAL */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-purple-950/20 backdrop-blur-xs p-4">
              <div className="w-full max-w-md bg-white rounded-3xl border border-purple-100 p-6 shadow-2xl space-y-5">
                <div className="flex items-center justify-between border-b border-purple-100 pb-3">
                  <h3 className="font-bold text-base text-purple-950">⚙️ Model Settings</h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-purple-400 hover:text-purple-800 text-sm">
                    ✕
                  </button>
                </div>
                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block font-semibold text-purple-900 mb-1">LLM Provider</label>
                    <select
                      value={provider}
                      onChange={(e) => setProvider(e.target.value)}
                      className="w-full rounded-xl border border-purple-200 bg-white px-3 py-2.5 text-purple-950 font-medium"
                    >
                      <option value="openai">OpenAI (GPT-4o)</option>
                      <option value="ollama">Ollama (Local Llama3)</option>
                    </select>
                  </div>
                  {provider === 'openai' ? (
                    <div>
                      <label className="block font-semibold text-purple-900 mb-1">OpenAI API Key</label>
                      <input
                        type="password"
                        placeholder="sk-..."
                        value={apiKey}
                        onChange={(e) => setApiKey(e.target.value)}
                        className="w-full rounded-xl border border-purple-200 bg-white px-3 py-2.5"
                      />
                    </div>
                  ) : (
                    <div>
                      <label className="block font-semibold text-purple-900 mb-1">Ollama Base URL</label>
                      <input
                        type="text"
                        value={ollamaUrl}
                        onChange={(e) => setOllamaUrl(e.target.value)}
                        className="w-full rounded-xl border border-purple-200 bg-white px-3 py-2.5"
                      />
                    </div>
                  )}
                </div>
                <button
                  onClick={() => setShowSettingsModal(false)}
                  className="w-full py-2.5 rounded-xl bg-purple-950 text-white font-semibold text-xs shadow-md"
                >
                  Save Settings
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
